services:
  database:
    image: postgres:16-alpine
    container_name: wayne_database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wayne}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wayne}
      POSTGRES_DB: ${POSTGRES_DB:-wayne_industries}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - wayne_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wayne} -d ${POSTGRES_DB:-wayne_industries}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wayne_pgdata:
